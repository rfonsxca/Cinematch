---
# Prepara todas as VMs: kernel, containerd e pacotes do Kubernetes.
- name: Preparar nós
  hosts: all
  become: true
  tasks:
    - name: Desativar swap (exigido pelo kubelet)
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Remover swap do fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Carregar módulos de kernel no arranque
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Carregar módulos agora
      ansible.builtin.command: "modprobe {{ item }}"
      loop: [overlay, br_netfilter]
      changed_when: false

    - name: Parâmetros de rede exigidos pelo Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        mode: "0644"
      register: sysctl_conf

    - name: Aplicar sysctl
      ansible.builtin.command: sysctl --system
      when: sysctl_conf.changed

    - name: Instalar dependências e containerd
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name: [apt-transport-https, ca-certificates, curl, gpg, containerd]
        state: present

    - name: Pasta de configuração do containerd
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Gerar configuração por omissão do containerd
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: containerd com cgroups systemd (exigido pelo kubelet)
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Reiniciar containerd

    - name: Chave do repositório do Kubernetes
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_minor }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: "0644"

    - name: Repositório do Kubernetes
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ k8s_minor }}/deb/ /\n"
        mode: "0644"
      register: k8s_repo

    - name: Instalar kubelet, kubeadm e kubectl
      ansible.builtin.apt:
        update_cache: "{{ k8s_repo.changed }}"
        name: [kubelet, kubeadm, kubectl]
        state: present

    - name: Fixar versões (evita atualizações acidentais do cluster)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]

  handlers:
    - name: Reiniciar containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true
