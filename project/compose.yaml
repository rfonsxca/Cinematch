services:
  # Único ponto publicado no anfitrião; os restantes serviços comunicam na rede do Compose.
  frontend:
    image: nginx:1.28-alpine
    ports: ["8080:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [users, recommendations]
  users:
    # A mesma imagem Python assume papéis diferentes através de ROLE.
    build:
      context: .
      dockerfile: services/Dockerfile
    environment:
      ROLE: users
      INTERNAL_KEY: ${INTERNAL_KEY:?Copy .env.example to .env and set INTERNAL_KEY}
    volumes: ["users-data:/data"]
  recommendations:
    build:
      context: .
      dockerfile: services/Dockerfile
    environment:
      ROLE: recommendations
      USERS_URL: http://users:8000
      OLLAMA_URL: http://ollama:11434
      MODEL: ${MODEL:-qwen2.5:0.5b}
      INTERNAL_KEY: ${INTERNAL_KEY}
    volumes: ["recommendations-data:/data"]
    depends_on: [users, ollama]
  worker:
    # depends_on ordena o arranque, mas não garante prontidão; o worker tenta de novo após falhas.
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["python", "worker.py"]
    environment:
      RECOMMENDATIONS_URL: http://recommendations:8000
      INTERNAL_KEY: ${INTERNAL_KEY}
      WORKER_INTERVAL: "300"
    depends_on: [recommendations]
  ollama:
    image: ollama/ollama:0.40.3
    volumes: ["models:/root/.ollama"]
  # Monitorização: Prometheus recolhe as métricas; Grafana mostra o dashboard (http://localhost:3000, admin/admin).
  prometheus:
    image: prom/prometheus:v3.15.0
    ports: ["9090:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [users, recommendations]
  grafana:
    image: grafana/grafana:13.2.4
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
volumes:
  # Dados separados por serviço e pesos persistentes evitam perdas ao recriar os contentores.
  users-data:
  recommendations-data:
  models: