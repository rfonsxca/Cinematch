services:
  # Único ponto publicado no anfitrião; os restantes serviços comunicam na rede do Compose.
  frontend:
    image: nginx:stable-alpine
    ports: ["8080:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [users, recommendations]
  users:
    # A mesma imagem Python assume papéis diferentes através de ROLE.
    build:
      context: .
      dockerfile: services/Dockerfile
    environment:
      ROLE: users
      INTERNAL_KEY: ${INTERNAL_KEY:?Copy .env.example to .env and set INTERNAL_KEY}
    volumes: ["users-data:/data"]
  recommendations:
    build:
      context: .
      dockerfile: services/Dockerfile
    environment:
      ROLE: recommendations
      USERS_URL: http://users:8000
      OLLAMA_URL: http://ollama:11434
      MODEL: ${MODEL:-qwen2.5:0.5b}
      INTERNAL_KEY: ${INTERNAL_KEY}
    volumes: ["recommendations-data:/data"]
    depends_on: [users, ollama]
  worker:
    # depends_on ordena o arranque, mas não garante prontidão; o worker tenta de novo após falhas.
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["python", "worker.py"]
    environment:
      RECOMMENDATIONS_URL: http://recommendations:8000
      INTERNAL_KEY: ${INTERNAL_KEY}
      WORKER_INTERVAL: "300"
    depends_on: [recommendations]
  ollama:
    image: ollama/ollama:latest
    volumes: ["models:/root/.ollama"]
volumes:
  # Dados separados por serviço e pesos persistentes evitam perdas ao recriar os contentores.
  users-data:
  recommendations-data:
  models:
