<!doctype html>
<html lang="pt">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CineMatch · Recomendações de filmes</title>
<style>
  /* Atributo hidden controla a alternância entre autenticação e área pessoal. */
  :root{color-scheme:dark;font:16px system-ui;background:#10131b;color:#edf0f8}
  body{max-width:900px;margin:50px auto;padding:0 20px}h1{font-size:2.5rem;margin-bottom:8px}
  .intro{color:#b8bfd2}section{background:#1b2030;padding:24px;border-radius:14px;margin:22px 0}
  label{display:block;margin:14px 0 7px}input,textarea,button{font:inherit;box-sizing:border-box;border-radius:8px;padding:12px}
  input,textarea{width:100%;border:1px solid #515a73;background:#111725;color:inherit}textarea{min-height:90px}
  button{background:#a9baff;color:#111725;border:0;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.5;cursor:wait}
  pre{white-space:pre-wrap;font:inherit;line-height:1.65}#status{min-height:24px;color:#ffdc99}
  .profile{padding:14px 0;border-bottom:1px solid #424a60}.profile p{white-space:pre-wrap;color:#c4ccde}
  [hidden]{display:none!important}
</style>
<h1>CineMatch</h1>
<p class="intro">Descobre o próximo filme com recomendações baseadas nos teus interesses.</p>
<p id="status" role="status" aria-live="polite"></p>
<section id="auth">
  <h2>Entra ou cria uma conta</h2>
  <form id="authForm">
    <label for="username">Nome de utilizador</label><input id="username" autocomplete="username" minlength="3" maxlength="40" required>
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="256" required>
    <button type="submit">Entrar</button><button type="submit" name="register" value="yes">Criar conta</button>
  </form>
</section>
<main id="app" hidden>
  <p>Olá, <strong id="welcome"></strong>! <button id="logout">Sair</button></p>
  <section><h2>O teu perfil</h2><form id="profileForm">
    <label for="interests">Géneros, filmes favoritos e outras preferências</label>
    <textarea id="interests" maxlength="2000" placeholder="Gosto de ficção científica e mistério…"></textarea>
    <button>Guardar perfil</button>
  </form></section>
  <section><h2>Recomendações para ti</h2>
    <p class="intro">As sugestões preparadas ficam disponíveis aqui. A primeira geração pode demorar.</p>
    <pre id="recommendations"></pre>
    <form id="recommendForm"><label for="prompt">O que te apetece ver?</label>
      <textarea id="prompt" required maxlength="2000" placeholder="Um filme de aventura para ver em família"></textarea>
      <button>Pedir recomendações</button>
    </form>
  </section>
  <section><h2>Descobre outros perfis</h2><button id="refreshProfiles">Atualizar perfis</button><div id="profiles"></div></section>
</main>
<script>
// A sessão sobrevive a recargas nesta aba; a validade do token é verificada pelo servidor.
let token = sessionStorage.getItem('token') || '';
const el = id => document.getElementById(id);
async function api(service, path, method='GET', body){
  // O Nginx encaminha caminhos relativos, dispensando endereços internos no navegador.
  const response = await fetch(`/api/${service}/${path}`, {
    method, headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
    body:body===undefined?undefined:JSON.stringify(body)
  });
  const result = await response.json();
  if(!response.ok) throw new Error(result.error || 'O pedido falhou.');
  return result;
}
async function action(work){
  // Centralizar estado e erros evita submissões repetidas enquanto um pedido decorre.
  el('status').textContent='A processar…';
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  try { await work(); el('status').textContent='Concluído.'; }
  catch(error){ el('status').textContent=error.message; }
  finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}
}
async function profiles(){
  const users=await api('users','profiles'); el('profiles').replaceChildren();
  for(const user of users){
    // textContent apresenta dados como texto, sem interpretar HTML introduzido por utilizadores.
    const row=document.createElement('div');row.className='profile';
    const name=document.createElement('strong');name.textContent=user.username;
    const interests=document.createElement('p');interests.textContent=user.interests || 'Sem interesses preenchidos.';
    row.append(name,interests);el('profiles').append(row);
  }
}
async function openApp(){
  // Recuperar a última resposta guardada permite entrar sem esperar por nova inferência.
  const user=await api('users','me');
  el('welcome').textContent=user.username;el('interests').value=user.interests;
  el('auth').hidden=true;el('app').hidden=false;
  const cached=await api('recommendations','');
  el('recommendations').textContent=cached.content || 'Ainda não há recomendações guardadas. Preenche o perfil e faz um pedido, ou aguarda a preparação automática.';
  await profiles();
}
el('authForm').onsubmit=event=>{
  // Os dois botões partilham o formulário; o botão escolhido determina registo ou login.
  event.preventDefault();const register=event.submitter?.name==='register';
  action(async()=>{
    const result=await api('users',register?'register':'login','POST',{
      username:el('username').value,password:el('password').value
    });
    token=result.token;sessionStorage.setItem('token',token);el('password').value='';await openApp();
  });
};
el('profileForm').onsubmit=event=>{event.preventDefault();action(()=>api('users','me','PUT',{interests:el('interests').value}));};
el('recommendForm').onsubmit=event=>{event.preventDefault();action(async()=>{
  const result=await api('recommendations','','POST',{prompt:el('prompt').value});
  el('recommendations').textContent=result.content;
});};
el('refreshProfiles').onclick=()=>action(profiles);
// Sair limpa apenas a sessão no navegador; o token continua válido no servidor até expirar.
el('logout').onclick=()=>{sessionStorage.removeItem('token');token='';el('auth').hidden=false;el('app').hidden=true;el('status').textContent='Sessão terminada neste browser.';};
if(token) action(openApp);
</script>
</html>
