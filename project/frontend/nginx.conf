server {
    listen 80;
    root /usr/share/nginx/html;
    # A barra final remove o prefixo público e mantém frontend e APIs na mesma origem.
    location /api/users/ { proxy_pass http://users:8000/; }
    location /api/recommendations/ {
        proxy_pass http://recommendations:8000/;
        # A inferência local pode demorar mais do que um pedido HTTP habitual.
        proxy_read_timeout 300s;
    }
    # Servir a página principal quando não existe um ficheiro para o caminho pedido.
    location / { try_files $uri $uri/ /index.html; }
}
