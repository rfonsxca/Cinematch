# Modelo do Secret. NÃO está no kustomization.yaml: o valor real nunca deve ir para o Git.
# Criar com:  kubectl -n cinematch create secret generic app-secret --from-literal=INTERNAL_KEY="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: cinematch
type: Opaque
stringData:
  INTERNAL_KEY: replace-with-a-long-random-secret
