# Motor de inferência. Os pesos ficam num PVC para não serem descarregados de novo a cada reinício.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: cinematch
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: cinematch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: ollama}
  template:
    metadata:
      labels: {app: ollama}
    spec:
      enableServiceLinks: false
      containers:
        - name: ollama
          image: ollama/ollama:0.40.3
          ports: [{containerPort: 11434}]
          readinessProbe:
            tcpSocket: {port: 11434}
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: models, mountPath: /root/.ollama}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: ollama-models}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: cinematch
spec:
  selector: {app: ollama}
  ports: [{port: 11434, targetPort: 11434}]
---
# Descarrega o modelo para o PVC (o Compose exige um "ollama pull" manual). Usa a CLI da própria imagem
# do Ollama contra o Service; repete até o servidor responder. É idempotente: se o modelo já existir, termina logo.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull
  namespace: cinematch
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: pull
          image: ollama/ollama:0.40.3
          env:
            - {name: OLLAMA_HOST, value: "http://ollama:11434"}
            - name: MODEL
              valueFrom: {configMapKeyRef: {name: app-config, key: MODEL}}
          command: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 3; done; ollama pull \"$MODEL\""]
